name: Build Android APK (Adam 01)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Grant execute permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Rename output APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/adam-01-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adam-01-android-apk
          path: release-apk/adam-01-debug.apk
          retention-days: 30
